<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">

<title>rad—io · binlerce canlı radyo · thousands of live radio</title>
<meta name="description" content="Dünyanın dört bir yanından binlerce canlı radyo. Mod seç, çevir, keşfet.">
<meta property="og:title" content="rad—io · binlerce canlı radyo">
<meta property="og:description" content="Dünyanın dört bir yanından binlerce canlı radyo. Mod seç, çevir, keşfet.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="rad—io">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
--bg:#fafaf8;--bg2:#f2f1ec;--bg3:#e9e7e1;
--line:#e4e2db;--line2:#ccc9c0;
--ink:#1a1915;--ink2:#6b6860;--ink3:#aba89f;
--accent:#b8935a;--accentL:#f1e6d2;
--sakura:#d998a8;--sakura2:#f7e3e9;
--monoL:85%;--monoS:35%;
--r:3px;
--serif:'Noto Serif JP',serif;
--mono:'DM Mono',ui-monospace,monospace;
--ph:78px;
}
[data-theme="dark"]{
--bg:#121210;--bg2:#1b1a18;--bg3:#252320;
--line:#272522;--line2:#38352f;
--ink:#e6e3dc;--ink2:#8a8780;--ink3:#5a5852;
--accent:#c8a96e;--accentL:#2a2015;
--sakura:#c47a8a;--sakura2:#2a181e;
--monoL:22%;--monoS:25%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--mono);background:var(--bg);color:var(--ink);overflow:hidden;transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* sakura */
.sakura-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-20px;animation:fall linear infinite;opacity:0}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:.6}100%{transform:translate(60px,110vh) rotate(720deg);opacity:0}}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:220px 1fr;grid-template-rows:54px 1fr var(--ph);height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font-family:var(--serif);font-size:17px;font-weight:300;letter-spacing:.14em;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;background:none;border:none}
.logo-accent{color:var(--accent)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo-by{font-size:9px;font-family:var(--mono);color:var(--ink3);letter-spacing:.05em;border-left:1px solid var(--line2);padding-left:8px;white-space:nowrap}
.logo-by a{text-decoration:none;transition:color .15s}
.logo-by a:hover{color:var(--accent)}
.counter{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.counter b{color:var(--ink2);font-weight:400}
.live-dot{width:6px;height:6px;border-radius:50%;background:#d0574a;flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{display:flex;align-items:center;gap:6px}
.top-btn{font-size:10px;letter-spacing:.09em;color:var(--ink2);background:none;border:1px solid var(--line2);padding:5px 11px;cursor:pointer;transition:all .15s;border-radius:var(--r);white-space:nowrap}
.top-btn:hover{border-color:var(--ink2);color:var(--ink)}
.top-btn.active{border-color:var(--accent);color:var(--accent)}
.round-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s;flex-shrink:0}
.round-btn:hover{border-color:var(--ink2);color:var(--ink)}

/* sidebar */
.sidebar{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg);scrollbar-width:none;padding-bottom:20px}
.sidebar::-webkit-scrollbar{display:none}
.sb-sec{padding:16px 0 0}
.sb-lbl{font-size:9px;letter-spacing:.18em;color:var(--ink3);padding:0 18px 7px;text-transform:uppercase;display:flex;justify-content:space-between}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 18px;cursor:pointer;transition:background .12s;border:none;border-left:2px solid transparent;background:none;text-align:left;font-size:11.5px;letter-spacing:.03em;color:var(--ink2)}
.sb-item:hover{background:var(--bg2);color:var(--ink)}
.sb-item.active{border-left-color:var(--accent);background:var(--bg2);color:var(--ink)}
.sb-item.active .sb-icon{color:var(--accent)}
.sb-icon{font-size:12px;width:16px;text-align:center;flex-shrink:0}
.sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-sub{font-size:9px;color:var(--ink3)}
.sb-div{height:1px;background:var(--line);margin:14px 0 0}
.sb-empty{padding:4px 18px 6px;font-size:10px;color:var(--ink3);line-height:1.7}

/* main */
.main{overflow-y:auto;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--line2) transparent;position:relative}
.view{display:none;padding-bottom:30px}
.view.active{display:block}

/* stage */
.stage{display:flex;gap:26px;align-items:center;padding:30px 30px 26px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--bg))}
.stage-art{width:132px;height:132px;flex-shrink:0;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;position:relative;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.stage-info{min-width:0;flex:1}
.kicker{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.stage-name{font-family:var(--serif);font-weight:300;font-size:30px;line-height:1.2;margin:8px 0 8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stage-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;color:var(--ink2);min-height:20px}
.stage-meta a{text-decoration:none;border-bottom:1px dotted var(--ink3)}
.stage-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.big-btn{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;padding:9px 16px;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg);cursor:pointer;transition:all .15s;color:var(--ink)}
.big-btn:hover{border-color:var(--ink)}
.big-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.big-btn.primary:hover{opacity:.85}
.big-btn.faved{color:var(--accent);border-color:var(--accent)}
.tag{font-size:9.5px;background:var(--bg3);border:1px solid var(--line);padding:1px 7px;border-radius:20px;color:var(--ink2)}

/* eq */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:2px;height:3px;background:var(--ink3);border-radius:1px}
body.is-playing .eq i{background:var(--accent);animation:eq .9s ease-in-out infinite}
body.is-playing .eq i:nth-child(2){animation-delay:-.3s}
body.is-playing .eq i:nth-child(3){animation-delay:-.6s}
body.is-playing .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

/* art */
.art{position:relative;overflow:hidden;background:hsl(var(--h,40) var(--monoS) var(--monoL));display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--ink2)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--bg)}
.st-art{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);flex-shrink:0;font-size:17px}
.stage-art.art{font-size:52px}

/* section headers */
.vh{padding:20px 30px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh-title{font-family:var(--serif);font-size:20px;font-weight:300;display:flex;align-items:baseline;gap:8px}
.vh-jp{font-size:12px;color:var(--ink3)}
.vh-sub{font-size:10px;color:var(--ink3);letter-spacing:.07em;margin-top:3px}
.vh-acts{display:flex;gap:7px}
.sm-btn{font-size:10px;letter-spacing:.07em;color:var(--ink2);background:none;border:1px solid var(--line2);padding:5px 10px;cursor:pointer;border-radius:var(--r);transition:all .15s}
.sm-btn:hover{border-color:var(--ink2);color:var(--ink)}

/* grid */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.st-card{background:var(--bg);padding:13px 18px;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:13px;min-width:0}
.st-card:hover{background:var(--bg2)}
.st-card.playing{background:var(--bg2);box-shadow:inset 2px 0 0 var(--accent)}
.st-card.bad{opacity:.4}
.st-info{flex:1;min-width:0}
.st-name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.st-card.playing .st-name{color:var(--accent)}
.st-meta{font-size:9.5px;color:var(--ink3);display:flex;gap:7px;align-items:center;overflow:hidden;white-space:nowrap}
.ic-btn{width:28px;height:28px;border-radius:50%;border:1px solid transparent;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink3);transition:all .15s;flex-shrink:0}
.st-card:hover .ic-btn,.ic-btn.faved{border-color:var(--line2)}
.ic-btn:hover{color:var(--ink);border-color:var(--ink2)}
.ic-btn.faved{color:var(--accent);border-color:var(--accent)}
.more-row{display:flex;justify-content:center;padding:18px}

/* loading */
.ldg{padding:50px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink3);font-size:11px;letter-spacing:.09em;text-align:center}
.ldg-kanji{font-family:var(--serif);font-size:40px;font-weight:300;color:var(--line2);line-height:1}
.spin{width:18px;height:18px;border:1px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:70px;background:var(--bg);position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--bg2),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* discover */
.disc-hd{padding:22px 30px 6px}
.search-row{display:flex;gap:7px;margin-top:14px}
.search-in{flex:1;min-width:0;font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:9px 13px;color:var(--ink);outline:none;transition:border .15s;letter-spacing:.04em}
.search-in:focus{border-color:var(--ink2)}
.search-in::placeholder{color:var(--ink3)}
.chip-lbl{font-size:9px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;padding:14px 30px 6px}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;padding:0 30px}
.chip{font-size:10px;letter-spacing:.05em;padding:4px 11px;border:1px solid var(--line2);border-radius:20px;cursor:pointer;color:var(--ink2);background:var(--bg);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--ink2);color:var(--ink)}
.chip.active{border-color:var(--accent);color:var(--accent);background:var(--accentL)}
.chip.lang{border-color:var(--sakura);color:var(--sakura)}
.chip.lang.active{background:var(--sakura2)}
.disc-res-hd{padding:20px 30px 10px;font-size:10px;color:var(--ink3);letter-spacing:.08em}

/* queue */
.q-list{padding:6px 30px}
.q-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:padding-left .1s;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.q-item:hover{padding-left:6px}
.q-num{font-size:10px;color:var(--ink3);width:22px;text-align:right;flex-shrink:0}
.q-name{flex:1;font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-cc{font-size:10px;color:var(--ink3)}
.q-item.active .q-name{color:var(--accent)}

/* player bar */
.player-bar{grid-column:1/-1;border-top:1px solid var(--line);background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 22px;gap:18px;position:relative}
.load-line{position:absolute;top:-1px;left:0;height:1px;width:0;background:var(--accent)}
body.is-loading .load-line{animation:ll 1.4s ease-in-out infinite}
@keyframes ll{0%{left:0;width:0}50%{left:20%;width:50%}100%{left:100%;width:0}}
.np-left{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;background:none;border:none;text-align:left}
.np-art{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);flex-shrink:0;font-size:17px}
.np-txt{min-width:0}
.np-name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sub{font-size:10px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.np-ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctrls{display:flex;align-items:center;gap:8px}
.ctrl{width:32px;height:32px;border-radius:50%;background:none;border:1px solid var(--line2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);transition:all .15s}
.ctrl:hover{border-color:var(--ink);color:var(--ink)}
.ctrl.play{width:40px;height:40px;border-color:var(--ink2);font-size:13px;color:var(--ink)}
.ctrl.play:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctrl.zap{width:auto;padding:0 12px;border-radius:20px;font-size:10px;letter-spacing:.08em;gap:6px}
.live-row{font-size:9.5px;color:var(--ink3);letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.live-row .on{color:#d0574a}
.np-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.ctrl.active{border-color:var(--accent);color:var(--accent)}
.ctrl.sleep{width:auto;min-width:32px;padding:0 9px;border-radius:16px;font-size:10px}
.vol-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.vol-row button{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:12px;width:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:2px;background:var(--line2);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ink2);border:none;cursor:pointer}

/* toast & modal */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);font-size:10.5px;letter-spacing:.06em;padding:8px 15px;border-radius:var(--r);opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap;z-index:99;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:24px 26px;max-width:360px;width:100%;font-size:11px;color:var(--ink2)}
.modal-box h3{font-family:var(--serif);font-weight:300;font-size:18px;color:var(--ink);margin-bottom:14px}
.kb{display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:1px 6px;color:var(--ink)}

.m-only{display:none}

/* map */
#view-map.active{height:100%;padding:0}
.map-wrap{position:relative;height:100%;min-height:360px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg) 75%)}
#mapCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#mapCv.grabbing{cursor:grabbing}
.map-hud{position:absolute;top:16px;left:18px;right:18px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.map-hud > *{pointer-events:auto;width:max-content;max-width:100%}
.map-title{font-family:var(--serif);font-size:20px;font-weight:300;display:flex;align-items:baseline;gap:8px}
.map-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.map-acts .sm-btn{background:var(--bg)}
.sm-btn.active,.big-btn.active{border-color:var(--accent);color:var(--accent)}
.map-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:10.5px;padding:6px 10px;border-radius:var(--r);white-space:nowrap;opacity:0;transform:translate(-50%,-130%);transition:opacity .12s;z-index:3}
.map-tip.show{opacity:1}
.map-tip small{display:block;opacity:.65;font-size:9.5px;margin-top:2px}
.map-zoom{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px}
.map-zoom button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);cursor:pointer;font-size:15px;color:var(--ink2)}
.map-zoom button:hover{border-color:var(--ink);color:var(--ink)}
.map-legend{position:absolute;left:18px;bottom:16px;font-size:9.5px;color:var(--ink3);letter-spacing:.06em;display:flex;gap:12px;align-items:center}
.map-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.log-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.log-tile{background:var(--bg);padding:16px 20px}
.log-num{font-family:var(--serif);font-size:26px;font-weight:300;line-height:1.1}
.log-lbl{font-size:9.5px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.log-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:20px 30px}
.log-h{font-size:9.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin-bottom:12px}
.week{display:flex;align-items:flex-end;gap:8px;height:110px}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week-bar{width:100%;max-width:34px;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:2px}
.week-col.today .week-bar{opacity:1}
.week-d{font-size:9px;color:var(--ink3)}
.stamps{display:flex;flex-wrap:wrap;gap:8px}
.stamp{border:1px dashed var(--line2);border-radius:6px;padding:7px 9px;text-align:center;min-width:64px;transform:rotate(var(--rot,0deg))}
.stamp b{display:block;font-size:20px;font-weight:400;line-height:1.2}
.stamp span{font-size:9px;color:var(--ink3)}
.top-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink2)}
.top-row:hover{color:var(--ink)}
.top-row .t-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-row .t-s{font-size:10px;color:var(--ink3)}
.form-row{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.form-row label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.form-row input,.form-row select{font-family:var(--mono);font-size:13px;padding:8px 10px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);color:var(--ink)}
.modal-note{font-size:10px;color:var(--ink3);line-height:1.6;margin-top:8px}
.modal-acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

@media(max-width:760px){
.log-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.log-grid{grid-template-columns:1fr;padding:16px}
.map-legend{display:none}
.map-hud{top:10px;left:12px;right:12px}
.map-title{font-size:17px}
.shell{grid-template-columns:minmax(0,1fr);grid-template-rows:50px auto 1fr auto}
.topbar{padding:0 12px;gap:8px}
.logo-by,.counter .c-extra,.counter .c-word{display:none}
.counter{font-size:9.5px}
.top-btn{padding:5px 8px}
.top-btn .t-full{display:none}
.sidebar{border-right:none;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden;padding:6px 6px}
.sb-sec{display:flex;padding:0;flex-shrink:0}
.sb-lbl,.sb-div,.sb-lib,.sb-sub{display:none}
.sb-item{width:auto;flex-direction:column;padding:5px 10px;gap:3px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap;font-size:10px;align-items:center}
.sb-item.active{border-bottom-color:var(--accent);border-left:none}
.sb-sec.countries .sb-item .sb-name{display:none}
.stage{padding:20px 16px 18px;gap:16px}
.stage-art{width:88px;height:88px}
.stage-art.art{font-size:34px}
.stage-name{font-size:21px;margin:6px 0}
.big-btn{padding:8px 12px;font-size:10.5px}
.vh,.disc-hd{padding-left:16px;padding-right:16px}
.chip-lbl,.chip-row,.disc-res-hd,.q-list{padding-left:16px;padding-right:16px}
.chip-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.st-grid{grid-template-columns:1fr}
.player-bar{grid-template-columns:minmax(0,1fr) auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:10px}
.np-right{display:none}
.live-row{display:none}
.ctrl.prev,.ctrl.zap .z-txt{display:none}
.ctrl.zap{padding:0;width:32px;border-radius:50%}
.m-only{display:flex}
.toast{bottom:150px}
}
@media(prefers-reduced-motion:reduce){
.sakura-bg{display:none}
*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
}

/* ===== v5 ===== */
.stage-acts2{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:var(--bg)}
.seg button{font-size:10px;letter-spacing:.07em;padding:5px 12px;border:none;background:none;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.lang-btn{font-weight:400}
.pc-img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:var(--r);border:1px solid var(--line);background:var(--bg2)}
.modal-box.wide{max-width:440px}
.pc-wait{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--ink3)}

/* araç modu */
.car{position:fixed;inset:0;z-index:300;background:#0b0b0a;color:#f2efe8;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));font-family:var(--mono);user-select:none;-webkit-user-select:none}
.car[hidden]{display:none}
.car-top{display:flex;align-items:center;gap:14px;font-size:clamp(16px,2.6vw,22px);color:#9d988d}
.car-clock{font-variant-numeric:tabular-nums;color:#f2efe8}
.car-net{font-size:.75em}
.car-net.off{color:#e0705f}
.car-x{margin-left:auto;font-family:inherit;font-size:clamp(14px,2.2vw,18px);color:#f2efe8;background:#1f1e1b;border:1px solid #3a3833;border-radius:40px;padding:10px 20px;cursor:pointer}
.car-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;touch-action:pan-y;padding:10px 0}
.car-flag{font-size:clamp(34px,7vw,64px);line-height:1}
.car-name{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6.4vw,66px);line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.car-sub{font-size:clamp(14px,2.4vw,20px);color:#9d988d;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.car-state{color:#c8a96e}
.car-favs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 0 14px}
.car-favs::-webkit-scrollbar{display:none}
.car-fav{flex:0 0 auto;max-width:230px;min-height:58px;padding:10px 16px;border-radius:14px;border:1px solid #3a3833;background:#181715;color:#f2efe8;font-family:inherit;font-size:clamp(13px,2vw,16px);text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;overflow:hidden}
.car-fav span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car-fav.on{border-color:#c8a96e;color:#c8a96e}
.car-ctrls{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.6vw,16px)}
.car-ctrls button{min-height:clamp(70px,13vh,120px);border-radius:20px;border:1px solid #3a3833;background:#181715;color:#f2efe8;font-size:clamp(26px,5vw,42px);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.car-ctrls button:active{background:#2a2925}
.car-ctrls .car-play{background:#f2efe8;color:#0b0b0a;border-color:#f2efe8}
.car-ctrls .on{color:#c8a96e;border-color:#c8a96e}
@media (orientation:landscape) and (max-height:520px){
  .car{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto 1fr auto;column-gap:22px}
  .car-top{grid-column:1/-1}
  .car-main{grid-column:1;grid-row:2}
  .car-favs{grid-column:1;grid-row:3;padding-bottom:0}
  .car-ctrls{grid-column:2;grid-row:2/4;grid-template-columns:repeat(2,1fr);align-content:center}
  .car-ctrls .car-play{grid-column:1/-1;order:-1}
  .car-ctrls button{min-height:clamp(56px,20vh,96px)}
}
@media(max-width:420px){ .counter{display:none} }
</style>
</head>
<body>
<div class="sakura-bg" id="sakuraBg" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <button class="logo" data-act="home" aria-label="rad—io">rad<span class="logo-accent">—</span>io</button>
      <span class="logo-by">by <a href="https://github.com/hechecik" target="_blank" rel="noopener">@hechecik</a> · <a href="https://github.com/hechecik/rad-io" target="_blank" rel="noopener">repo</a></span>
    </div>
    <div class="counter" id="counter" aria-live="polite"><span class="live-dot"></span><span data-i18n="slogan"></span></div>
    <nav class="topbar-right">
      <button class="top-btn active" data-act="view" data-v="stations">◎<span class="t-full" data-i18n="nav.stations"></span></button>
      <button class="top-btn" data-act="view" data-v="map">◍<span class="t-full" data-i18n="nav.map"></span></button>
      <button class="top-btn" data-act="view" data-v="discover">⌕<span class="t-full" data-i18n="nav.discover"></span></button>
      <button class="top-btn" data-act="view" data-v="library">♡<span class="t-full" data-i18n="nav.library"></span></button>
      <button class="top-btn" data-act="view" data-v="queue">≡<span class="t-full" data-i18n="nav.queue"></span></button>
      <button class="top-btn" id="installBtn" data-act="install" hidden>📲<span class="t-full" data-i18n="nav.install"></span></button>
      <button class="top-btn lang-btn" id="langBtn" data-act="lang">EN</button>
      <button class="round-btn" id="themeBtn" data-act="theme" data-i18n-aria="a.theme">☽</button>
    </nav>
  </header>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main" id="main">
    <div class="view active" id="view-stations">
      <section class="stage" id="stage">
        <div class="stage-art art" id="stArt">桜</div>
        <div class="stage-info">
          <div class="kicker"><span class="eq"><i></i><i></i><i></i><i></i></span><span id="stKicker"></span></div>
          <h1 class="stage-name" id="stName" data-i18n="stage.idleName"></h1>
          <div class="stage-meta" id="stMeta" data-i18n="stage.idleMeta"></div>
          <div class="stage-acts">
            <button class="big-btn primary" data-act="play" id="stPlay"></button>
            <button class="big-btn" data-act="zap" data-i18n="b.zap"></button>
            <button class="big-btn" data-act="fav-cur" id="stFav"></button>
          </div>
          <div class="stage-acts2">
            <button class="sm-btn" data-act="share" data-i18n="b.share"></button>
            <button class="sm-btn" data-act="postcard" data-i18n="b.postcard"></button>
            <button class="sm-btn" data-act="similar" data-i18n="b.similar"></button>
            <button class="sm-btn tour-btn" data-act="tour" data-i18n="b.tour"></button>
            <button class="sm-btn" data-act="car" data-i18n="b.car"></button>
          </div>
        </div>
      </section>
      <div class="vh">
        <div><div class="vh-title" id="vhTitle">—</div><div class="vh-sub" id="vhSub"></div></div>
        <div class="vh-acts"><button class="sm-btn" data-act="refresh" data-i18n="b.more"></button></div>
      </div>
      <div id="collRes"></div>
    </div>

    <div class="view" id="view-map">
      <div class="map-wrap" id="mapWrap">
        <canvas id="mapCv"></canvas>
        <div class="map-hud">
          <div class="map-title"><span data-i18n="map.title"></span> <span class="vh-jp">地図</span></div>
          <div class="vh-sub" id="mapSub"></div>
          <div class="map-acts">
            <span class="seg"><button data-act="map-mode" data-m="globe" data-i18n="map.globe"></button><button data-act="map-mode" data-m="flat" data-i18n="map.flat"></button></span>
            <button class="sm-btn" data-act="near" data-i18n="map.near"></button>
            <button class="sm-btn tour-btn" data-act="tour" data-i18n="b.tour"></button>
            <button class="sm-btn" data-act="map-center" data-i18n="map.center"></button>
            <button class="sm-btn" data-act="map-reset" data-i18n="map.reset"></button>
          </div>
        </div>
        <div class="map-tip" id="mapTip"></div>
        <div class="map-legend"><span><i style="background:var(--accent)"></i><b data-i18n="lg.live" style="font-weight:400"></b></span><span><i style="background:var(--sakura)"></i><b data-i18n="lg.fav" style="font-weight:400"></b></span><span><i style="background:var(--ink3);opacity:.5"></i><b data-i18n="lg.night" style="font-weight:400"></b></span><span><i style="border:1px solid var(--sakura)"></i><b data-i18n="lg.trail" style="font-weight:400"></b></span><span data-i18n="lg.hint"></span></div>
        <div class="map-zoom"><button data-act="zoom-in" aria-label="+">+</button><button data-act="zoom-out" aria-label="−">−</button></div>
      </div>
    </div>

    <div class="view" id="view-discover">
      <div class="disc-hd">
        <div class="vh-title"><span data-i18n="d.title"></span> <span class="vh-jp">発見</span></div>
        <div class="vh-sub" id="discSub"></div>
        <form class="search-row" id="searchForm">
          <input class="search-in" id="searchIn" type="search" data-i18n-ph="d.ph" autocomplete="off" enterkeyhint="search">
          <button class="sm-btn" type="submit" data-i18n="d.search"></button>
        </form>
      </div>
      <div class="chip-lbl" data-i18n="d.sort"></div><div class="chip-row" id="sortChips"></div>
      <div class="chip-lbl" data-i18n="d.tags"></div><div class="chip-row" id="tagChips"></div>
      <div class="chip-lbl" data-i18n="d.country"></div><div class="chip-row" id="ccChips"></div>
      <div class="disc-res-hd" id="discHd"></div>
      <div id="discRes"></div>
    </div>

    <div class="view" id="view-library">
      <div class="vh"><div><div class="vh-title"><span data-i18n="l.log"></span> <span class="vh-jp">日記</span></div><div class="vh-sub" data-i18n="l.logSub"></div></div>
        <div class="vh-acts"><button class="sm-btn" data-act="share-log" data-i18n="b.share"></button></div></div>
      <div id="logRes"></div>
      <div class="vh"><div><div class="vh-title"><span data-i18n="l.favs"></span> <span class="vh-jp">お気に入り</span></div><div class="vh-sub" id="favSub"></div></div>
        <div class="vh-acts"><button class="sm-btn" data-act="export" data-i18n="l.export"></button><button class="sm-btn" data-act="import" data-i18n="l.import"></button></div></div>
      <div id="favRes"></div>
      <div class="vh"><div><div class="vh-title"><span data-i18n="l.recents"></span> <span class="vh-jp">履歴</span></div></div>
        <div class="vh-acts"><button class="sm-btn" data-act="clear-recent" data-i18n="l.clear"></button></div></div>
      <div id="recRes"></div>
      <input type="file" id="importIn" accept="application/json" hidden>
    </div>

    <div class="view" id="view-queue">
      <div class="vh"><div><div class="vh-title"><span data-i18n="q.title"></span> <span class="vh-jp">順番</span></div><div class="vh-sub" id="qSub">—</div></div></div>
      <div class="q-list" id="qItems"></div>
    </div>
  </main>

  <footer class="player-bar">
    <div class="load-line"></div>
    <button class="np-left" data-act="view" data-v="stations">
      <div class="np-art art" id="npArt">♪</div>
      <div class="np-txt">
        <div class="np-name" id="npName">rad—io</div>
        <div class="np-sub"><span class="eq"><i></i><i></i><i></i><i></i></span><span id="npSub" data-i18n="slogan"></span></div>
      </div>
    </button>
    <div class="np-ctr">
      <div class="ctrls">
        <button class="ctrl m-only" data-act="fav-cur" id="npFavM" data-i18n-aria="a.fav">♡</button>
        <button class="ctrl prev" data-act="prev" data-i18n-aria="a.prev">⏮</button>
        <button class="ctrl play" id="playBtn" data-act="play" data-i18n-aria="a.play">▶</button>
        <button class="ctrl" data-act="next" data-i18n-aria="a.next">⏭</button>
        <button class="ctrl zap" data-act="zap" data-i18n-aria="a.zap">📻<span class="z-txt" data-i18n="b.zapShort"></span></button>
      </div>
      <div class="live-row"><span class="on">●</span><span id="liveTxt"></span></div>
    </div>
    <div class="np-right">
      <button class="ctrl" data-act="fav-cur" id="npFav" data-i18n-aria="a.fav">♡</button>
      <button class="ctrl" data-act="car" data-i18n-aria="a.car">🚗</button>
      <button class="ctrl" data-act="cast" id="castBtn" data-i18n-aria="a.cast" hidden>📡</button>
      <button class="ctrl sleep" data-act="sleep" id="sleepBtn" data-i18n-aria="a.sleep">☾</button>
      <button class="ctrl sleep" data-act="alarm" id="alarmBtn" data-i18n-aria="a.alarm">⏰</button>
      <button class="ctrl" data-act="static" id="staticBtn" data-i18n-aria="a.static">∿</button>
      <div class="vol-row">
        <button data-act="mute" id="muteBtn" data-i18n-aria="a.mute">♪</button>
        <input type="range" id="volSlider" min="0" max="1" step="0.02" value="0.7" data-i18n-aria="a.vol">
      </div>
      <button class="ctrl" data-act="help" data-i18n-aria="a.help">?</button>
    </div>
  </footer>
</div>

<!-- araç modu -->
<div class="car" id="car" hidden>
  <div class="car-top"><span class="car-clock" id="carClock">--:--</span><span class="car-net" id="carNet"></span><button class="car-x" data-act="car-exit">✕ <span data-i18n="car.exit"></span></button></div>
  <div class="car-main" id="carMain">
    <div class="car-flag" id="carFlag"></div>
    <div class="car-name" id="carName">rad—io</div>
    <div class="car-sub"><span class="car-state" id="carState"></span><span id="carSub"></span></div>
  </div>
  <div class="car-favs" id="carFavs"></div>
  <div class="car-ctrls">
    <button data-act="prev" data-i18n-aria="a.prev">⏮</button>
    <button data-act="play" class="car-play" id="carPlay" data-i18n-aria="a.play">▶</button>
    <button data-act="next" data-i18n-aria="a.next">⏭</button>
    <button data-act="zap" data-i18n-aria="a.zap">📻</button>
    <button data-act="fav-cur" id="carFav" data-i18n-aria="a.fav">♡</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="modal" id="helpModal" data-act="close-modal">
  <div class="modal-box">
    <h3 data-i18n="h.title"></h3>
    <div class="kb">
      <kbd>␣</kbd><span data-i18n="h.play"></span>
      <kbd>R</kbd><span data-i18n="h.zap"></span>
      <kbd>← →</kbd><span data-i18n="h.prevnext"></span>
      <kbd>↑ ↓</kbd><span data-i18n="h.vol"></span>
      <kbd>F</kbd><span data-i18n="h.fav"></span>
      <kbd>M</kbd><span data-i18n="h.mute"></span>
      <kbd>G</kbd><span data-i18n="h.map"></span>
      <kbd>W</kbd><span data-i18n="h.tour"></span>
      <kbd>C</kbd><span data-i18n="h.car"></span>
      <kbd>P</kbd><span data-i18n="h.postcard"></span>
      <kbd>/</kbd><span data-i18n="h.search"></span>
      <kbd>D L Q</kbd><span data-i18n="h.views"></span>
      <kbd>T</kbd><span data-i18n="h.theme"></span>
    </div>
    <div class="modal-acts"><button class="sm-btn" data-act="lang" data-i18n="h.lang"></button></div>
  </div>
</div>

<div class="modal" id="alarmModal" data-act="close-modal">
  <div class="modal-box">
    <h3 data-i18n="al.title"></h3>
    <div class="form-row"><label for="alarmTime" data-i18n="al.time"></label><input type="time" id="alarmTime" value="07:30"></div>
    <div class="form-row"><label for="alarmSrc" data-i18n="al.what"></label>
      <select id="alarmSrc">
        <option value="cur" data-i18n="al.cur"></option>
        <option value="fav" data-i18n="al.fav"></option>
        <option value="kafe" data-i18n="al.kafe"></option>
        <option value="zap" data-i18n="al.zap"></option>
      </select></div>
    <div class="modal-note" data-i18n="al.note"></div>
    <div class="modal-acts"><button class="sm-btn" data-act="alarm-off" data-i18n="al.off"></button><button class="big-btn primary" data-act="alarm-set" data-i18n="al.set"></button></div>
  </div>
</div>

<div class="modal" id="pcModal" data-act="close-modal">
  <div class="modal-box wide">
    <h3 data-i18n="pc.title"></h3>
    <div id="pcBody"></div>
    <div class="modal-acts"><button class="sm-btn" data-act="pc-download" data-i18n="pc.download"></button><button class="big-btn primary" data-act="pc-share" data-i18n="pc.share"></button></div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   rad—io v5 · binlerce canlı radyo / thousands of live radio
   ========================================================= */

/* ---------- i18n ---------- */
const I18N = {
tr:{
  'slogan':'binlerce canlı radyo','nav.stations':' radyolar','nav.map':' harita','nav.discover':' keşfet','nav.library':' kitaplık','nav.queue':' sıra','nav.install':' yükle',

let SERVERS = shuffle(['de1','de2','nl1','at1','fi1'].map(h=>`https://${h}.api.radio-browser.info`));
async function api(path, timeout=9000) {
  for (const base of SERVERS) {
    const ac = new AbortController(); const tm = setTimeout(()=>ac.abort(), timeout);
    try {
      const r = await fetch(base+path, {signal:ac.signal});
      clearTimeout(tm);
      if (r.ok) { SERVERS = [base, ...SERVERS.filter(x=>x!==base)]; return await r.json(); }
    } catch(e) { clearTimeout(tm); }
  }
  return null;
}
const BASEQ = 'hidebroken=true&is_https=true';

const LIB = new Map();
const numOrNull = v => (v===null || v===undefined || v==='' || !Number.isFinite(+v)) ? null : +v;
function norm(s) {
  if (!s || !s.stationuuid) return null;
  const url = s.url_resolved || s.url || '';
  if (!/^https:\/\//i.test(url)) return null;
  if (+s.hls && !canHls) return null;
  const st = {
    uuid:s.stationuuid, name:(s.name||'Radio').replace(/\s+/g,' ').trim().slice(0,80), url,
    favicon:/^https:\/\//i.test(s.favicon||'') ? s.favicon : '',
    cc:(s.countrycode||'').toUpperCase(), country:s.country||'', state:(s.state||'').slice(0,40),
    tags:(s.tags||'').split(',').map(x=>x.trim().toLowerCase()).filter(x=>x&&x.length<24).slice(0,4),
    codec:(s.codec||'').toLowerCase(), bitrate:+s.bitrate||0,
    homepage:/^https?:\/\//i.test(s.homepage||'') ? s.homepage : '', votes:+s.votes||0,
    lat:numOrNull(s.geo_lat), lon:numOrNull(s.geo_long),
  };
  if (st.lat===0 && st.lon===0) st.lat = st.lon = null;
  LIB.set(st.uuid, st); return st;
}
function normList(arr, exclude=new Set()) {
  const seen = new Set(), out = [];
  for (const s of arr||[]) {
    const n = norm(s); if (!n) continue;
    const k = n.name.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
    if (seen.has(k) || exclude.has(n.uuid)) continue;
    seen.add(k); out.push(n);
  }
  return out;
}
function slim(s){ return {uuid:s.uuid,name:s.name,url:s.url,favicon:s.favicon,cc:s.cc,country:s.country,state:s.state||'',tags:s.tags||[],codec:s.codec,bitrate:s.bitrate,homepage:s.homepage||'',votes:s.votes||0,lat:s.lat??null,lon:s.lon??null}; }

/* ---------- static noise ---------- */
let actx=null, noiseBuf=null, noise=null;
function ensureCtx(){
  if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; } }
  if (actx.state==='suspended') actx.resume().catch(()=>{});
}
function staticOn(){
  if (!S.staticFx || !actx || actx.state!=='running') return;
  staticOff(true);
  if (!noiseBuf) {
    const len = actx.sampleRate*2; noiseBuf = actx.createBuffer(1,len,actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  const src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200; bp.Q.value=.5;
  const g=actx.createGain(); g.gain.value=0.05*audio.volume*(audio.muted?0:1);
  src.connect(bp).connect(g).connect(actx.destination); src.start();
  noise={src,g};
  clearTimeout(staticOn._t); staticOn._t=setTimeout(staticOff,7000);
}
function staticOff(now){
  if (!noise) return;
  const {src,g}=noise; noise=null;
  try { if (now) src.stop(); else { g.gain.setTargetAtTime(0,actx.currentTime,.12); setTimeout(()=>{try{src.stop()}catch(e){}},500); } } catch(e){}
}

/* ---------- güneş ---------- */
function sunPos(d=new Date()){
  const n=(d.getTime()-Date.UTC(2000,0,1,12))/864e5;
  const L=(280.46+0.9856474*n)%360, g=((357.528+0.9856003*n)%360)*D2R;
  const lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*D2R, eps=(23.439-4e-7*n)*D2R;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))/D2R;
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;
  return {lat:dec/D2R, lon:((ra-gmst*15)%360+540)%360-180};
}
function sunAlt(lat, lon, sp=sunPos()){
  return Math.asin(Math.sin(lat*D2R)*Math.sin(sp.lat*D2R)+Math.cos(lat*D2R)*Math.cos(sp.lat*D2R)*Math.cos((lon-sp.lon)*D2R))/D2R;
}
function dayKind(st){
  if (!st || st.lat==null) return '';
  const a = sunAlt(st.lat, st.lon);
  return a>6 ? 'day' : a>-6 ? (sunAlt(st.lat, st.lon, sunPos(new Date(Date.now()+6e5)))>a ? 'dawn' : 'dusk') : 'night';
}
const dayLabel = st => { const k=dayKind(st); return k ? t('day.'+k) : ''; };

function setCollTitle(){

async function loadColl(type, key, {autoplay=true, random=true}={}) {
  const tok = ++collToken;
  S.coll = {type,key}; S.collList = [];
  switchView('stations');
  setCollTitle(); $('#vhSub').textContent = S.collSub+' · '+t('c.loading');
  $('#collRes').innerHTML = skeleton(8);
  refreshCards();
  const m = MODES[key];
  let list;
  if (m?.sun) {
    await loadMapData();
    if (tok!==collToken) return;
    const sp = sunPos(), sp2 = sunPos(new Date(Date.now()+15*60000));
    const ok = p => { const a=sunAlt(p.lat,p.lon,sp); return m.sun==='dawn' ? (a>-7 && a<12 && sunAlt(p.lat,p.lon,sp2)>a) : a<-28; };
    const byCC = {}; for (const p of MAP.pts) if (ok(p) && !S.bad.has(p.uuid)) (byCC[p.cc||'?'] ||= []).push(p);
    const lists = shuffle(Object.values(byCC).map(l=>shuffle(l.slice())));
    list = []; let i=0;
    while (list.length<30 && lists.some(l=>l.length)) { const l=lists[i++%lists.length]; if (l.length) list.push(l.pop()); }
  } else {
    let raw = [];
    if (type==='country' || m?.cc) {
      const cc = type==='country' ? key : m.cc;
      const off = random ? Math.floor(Math.random()*3)*40 : 0;
      const [a,b] = await Promise.all([search(`countrycode=${cc}&order=votes&reverse=true`,60,0), search(`countrycode=${cc}&order=clicktrend&reverse=true`,40,off)]);
      raw = [...(a||[]),...(b||[])];
    } else {
      const res = await Promise.allSettled(m.tags.map(tg=>search(`tag=${encodeURIComponent(tg)}&order=votes&reverse=true`,40,0)));
      res.forEach(r=>{ if (r.status==='fulfilled' && r.value) raw.push(...r.value); });
    }
    if (tok!==collToken) return;
    list = normList(raw);
    list = (random ? shuffle(list) : list).slice(0,30);
  }
  S.collList = list;
  setCollTitle();
  if (m?.sun && list.length) $('#vhSub').textContent = `${S.collSub} · ${[...new Set(list.map(p=>p.cc))].slice(0,10).map(flag).join('')} · ${t('c.count',{n:list.length})}`;
  if (!list.length) {
    $('#collRes').innerHTML = `<div class="ldg"><div class="ldg-kanji">${m?.sun?(m.sun==='dawn'?'暁':'夜'):'静'}</div><div>${esc(t(m?.sun?'c.sunEmpty':'c.empty'))}</div><button class="sm-btn" data-act="refresh">${esc(t('b.retry'))}</button></div>`;
    return;
  }
  $('#collRes').innerHTML = grid(list,'coll');
  refreshCards();
  if (autoplay) playFrom('coll', list[0].uuid);
}

const LOG = Object.assign({total:0, cc:{}, st:{}, days:{}}, LS.get('log', {}));
const dayKey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function logTick(sec){
  const st = LIB.get(S.cur); if (!st) return;
  LOG.total += sec;
  if (st.cc) LOG.cc[st.cc] = (LOG.cc[st.cc]||0)+sec;
  const e = LOG.st[st.uuid] || (LOG.st[st.uuid] = {s:0});
  e.s += sec; e.d = slim(st);
  const d = dayKey(); LOG.days[d] = (LOG.days[d]||0)+sec;
  const keys = Object.keys(LOG.st);
  if (keys.length>150) keys.sort((a,b)=>LOG.st[a].s-LOG.st[b].s).slice(0,keys.length-150).forEach(k=>delete LOG.st[k]);
  const dk = Object.keys(LOG.days).sort(); if (dk.length>90) dk.slice(0,dk.length-90).forEach(k=>delete LOG.days[k]);
  LS.set('log', LOG);
}
function fmtDur(sec){
  const m = Math.round(sec/60); if (m<60) return m+' '+t('u.min');
  const h = Math.floor(m/60); return h+' '+t('u.h')+(m%60?' '+(m%60)+' '+t('u.min'):'');
}
function streak(){
  let n=0; const d=new Date();
  if (!(LOG.days[dayKey(d)]>=60)) d.setDate(d.getDate()-1);
  while (LOG.days[dayKey(d)]>=60){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function renderLog(){

  const mx = Math.max(60, ...days.map(d=>d.v));

        <div class="log-h" style="margin-top:22px">${esc(t('l.top'))}</div>

      </div>

function shareLog(){
  const ccs = Object.entries(LOG.cc).sort((a,b)=>b[1]-a[1]);
  const top = Object.values(LOG.st).filter(e=>e.d).sort((a,b)=>b.s-a.s)[0];

let loadTimer=null, stallTimer=null, reTries=0;
function setState(st){
  S.state = st;
  document.body.classList.toggle('is-playing', st==='playing');
  document.body.classList.toggle('is-loading', st==='loading');
  const icon = st==='playing' ? '⏸' : st==='loading' ? '…' : '▶';
  $('#playBtn').textContent = icon; $('#carPlay').textContent = icon;
  $('#stPlay').textContent = t(st==='playing' ? 'b.pause' : st==='loading' ? 'b.connecting' : 'b.listen');
  if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = st==='playing'?'playing':st==='idle'?'none':'paused'; } catch(e){} }
  updateKicker(); updateCar(); requestDraw();
}
function kickerText(){
  if (!LIB.get(S.cur)) return t('slogan');
  if (S.state==='loading') return !navigator.onLine ? t('k.offline') : (reTries || S.stalled) ? t('k.reconnect') : t('k.loading');
  return t(S.state==='playing' ? 'k.live' : S.state==='paused' ? 'k.paused' : 'k.ready');
}
function updateKicker(){ $('#stKicker').textContent = kickerText(); }
function playFrom(ctx, uuid){
  S.queue = listFor(ctx).slice(); S.queueCtx = ctx;
  if (!S.queue.some(s=>s.uuid===uuid)) { const s=LIB.get(uuid); if (s) S.queue.unshift(s); }
  play(uuid);
}
function play(uuid){
  const st = LIB.get(uuid); if (!st) return;
  ensureCtx();
  S.cur = uuid; S.qi = S.queue.findIndex(s=>s.uuid===uuid); S.want = true; reTries = 0; S.stalled = false;
  clearTimeout(stallTimer);
  LS.set('last', slim(st));
  updateNP(st);
  setState('loading'); staticOn();
  audio.src = st.url;
  audio.play().catch(err=>{ if (err.name==='NotAllowedError') { clearTimeout(loadTimer); staticOff(true); S.want=false; setState('idle'); } });
  clearTimeout(loadTimer);
  loadTimer = setTimeout(()=>{ if (S.state==='loading' && S.cur===uuid && navigator.onLine) fail(); }, 12000);
  api(`/json/url/${uuid}`);
  try { history.replaceState(null,'',`#s=${uuid}`); } catch(e){}
  refreshCards(); if ($('#view-queue').classList.contains('active')) renderQueue();
}
function playPause(){
  ensureCtx();
  if (!S.cur) { zap(); return; }
  if (S.state==='playing') { S.want=false; audio.pause(); return; }
  if (S.state==='loading') { S.want=false; audio.pause(); clearTimeout(loadTimer); clearTimeout(stallTimer); staticOff(true); setState('paused'); return; }
  play(S.cur); // canlı yayında yeniden bağlan → gecikmesiz
}
function step(dir){
  if (!S.queue.length) { zap(); return; }
  if (S.queueCtx==='zap' && dir>0 && S.qi>=S.queue.length-1) { zap(); return; }
  let i = S.qi;
  for (let n=0;n<S.queue.length;n++){
    i = (i+dir+S.queue.length)%S.queue.length;
    if (!S.bad.has(S.queue[i].uuid)) { play(S.queue[i].uuid); return; }
  }
  zap();
}
function fail(){
  clearTimeout(loadTimer); clearTimeout(stallTimer); staticOff(true);
  if (!S.cur) return;
  S.bad.add(S.cur); S.errs++;
  refreshCards();
  if (S.errs>=6) { S.errs=0; S.want=false; setState('idle'); toast(t('t.failAll')); return; }
  toast(t('t.failNext'));
  setTimeout(()=>step(1), 700);
}
// tünel / zayıf sinyal: önce aynı yayına yeniden bağlan, olmazsa sıradakine geç
function reconnect(){
  clearTimeout(stallTimer);
  if (!S.want || !S.cur || S.state==='playing') return;
  if (!navigator.onLine) { updateKicker(); return; } // 'online' olayı devam ettirir
  reTries++;
  if (reTries>3) { reTries=0; fail(); return; }
  updateKicker();
  audio.src = LIB.get(S.cur).url;
  audio.play().catch(()=>{});
  stallTimer = setTimeout(reconnect, 9000);
}
audio.addEventListener('playing', ()=>{
  clearTimeout(loadTimer); clearTimeout(stallTimer); staticOff(); S.errs=0; reTries=0; S.stalled=false;
  if (S.state!=='playing') S.startedAt = Date.now();
  setState('playing');
  const st=LIB.get(S.cur); if (st) pushRecent(st);
});
const onStall = ()=>{ if (S.state==='playing' && S.want) { S.stalled=true; setState('loading'); clearTimeout(stallTimer); stallTimer=setTimeout(reconnect, 7000); } };
audio.addEventListener('waiting', onStall);
audio.addEventListener('stalled', onStall);
audio.addEventListener('pause', ()=>{ if (S.state==='playing') setState('paused'); });
audio.addEventListener('error', ()=>{
  if (!audio.src || !S.want) return;
  if (!navigator.onLine) { setState('loading'); return; }
  if (S.state==='playing' || reTries) { clearTimeout(stallTimer); stallTimer=setTimeout(reconnect, 1500); return; }
  fail();
});

const SLEEP_STEPS=[0,15,30,60,90];
let sleepIv=null;
function cycleSleep(){
  const left = S.sleepEnd ? Math.round((S.sleepEnd-Date.now())/60000) : 0;
  const idx = SLEEP_STEPS.findIndex(m=>m>left);
  const next = idx<0 ? 0 : SLEEP_STEPS[idx];
  S.sleepEnd = next ? Date.now()+next*60000 : 0;
  toast(next ? t('t.sleepOn',{n:next}) : t('t.sleepOff'));
  clearInterval(sleepIv); if (next) sleepIv=setInterval(sleepTick,5000);
  sleepTick();
}
function sleepTick(){
  const b=$('#sleepBtn');
  if (!S.sleepEnd) { b.textContent='☾'; b.classList.remove('active'); clearInterval(sleepIv); return; }
  const ms = S.sleepEnd-Date.now();
  b.textContent = '☾ '+Math.max(1,Math.ceil(ms/60000)); b.classList.add('active');
  if (ms<=0) {
    clearInterval(sleepIv); S.sleepEnd=0;
    const v0 = audio.volume; let i=0;
    const fade=setInterval(()=>{ i++; audio.volume=Math.max(0,v0*(1-i/20)); if(i>=20){ clearInterval(fade); S.want=false; audio.pause(); audio.volume=v0; sleepTick(); toast(t('t.night')); } },400);
  }
}
