/* =========================================================
   HARİTA + KÜRE  (performans: statik katman önbelleği,
   yalnızca gerektiğinde çizim, ~30 fps sınırı)
   ========================================================= */
const MAP = {pts:[], loaded:false, loading:false, active:false, globe:LS.get('globe', true),
  k:1, k0:1, cx:0, cy:0, w:0, h:0, dpr:1, hover:null, me:null, raf:0, last:0, force:true,
  // küre
  lat0:25, lon0:20, R:0, R0:0, spin:true, target:null, spinAt:0,
  layer:null, layerKey:''};
window.MAP = MAP;
const cv = $('#mapCv');
const MAP_CACHE_TTL = 12*3600*1000;
function prepPt(p){ p.sl=Math.sin(p.lat*D2R); p.cl=Math.cos(p.lat*D2R); p.sL=Math.sin(p.lon*D2R); p.cL=Math.cos(p.lon*D2R); return p; }
async function loadMapData(){
  if (MAP.loaded) return;
  if (MAP.loading) { while (MAP.loading) await new Promise(r=>setTimeout(r,150)); return; }
  MAP.loading = true;
  $('#mapSub').textContent = t('map.loading'); requestDraw();
  // 1) cihaz önbelleği (12 saat) → anında açılış, mobil veriden tasarruf
  const c = LS.get('mapcache', null);
  if (c && c.v===2 && Date.now()-c.t < MAP_CACHE_TTL && Array.isArray(c.d)) {
    for (const r of c.d) {
      const st = {uuid:r[0],name:r[1],url:r[2],favicon:r[3]||'',cc:r[4]||'',country:'',state:r[9]||'',tags:r[5]?[r[5]]:[],codec:r[6]||'',bitrate:r[7]||0,homepage:'',votes:0,lat:r[8][0],lon:r[8][1]};
      if (!LIB.has(st.uuid)) LIB.set(st.uuid, st);
      MAP.pts.push(prepPt(LIB.get(st.uuid).lat!=null ? LIB.get(st.uuid) : st));
    }
  } else {
    const res = await Promise.allSettled([
      search('has_geo_info=true&order=clickcount&reverse=true', 2500, 0),
      search('has_geo_info=true&order=votes&reverse=true', 1500, 0),
      search('has_geo_info=true&order=clicktrend&reverse=true', 600, 0),
    ]);
    const seen = new Set();
    for (const r of res) if (r.status==='fulfilled' && r.value) for (const s of r.value) {
      const n = norm(s); if (!n || n.lat==null || seen.has(n.uuid)) continue;
      seen.add(n.uuid); MAP.pts.push(prepPt(n));
    }
    if (MAP.pts.length) LS.set('mapcache', {v:2, t:Date.now(), d:MAP.pts.map(p=>[p.uuid,p.name,p.url,p.favicon,p.cc,p.tags[0]||'',p.codec,p.bitrate,[+p.lat.toFixed(3),+p.lon.toFixed(3)],p.state])});
  }
  MAP.loading = false; MAP.loaded = MAP.pts.length>0; DATA_VER++;
  $('#mapSub').textContent = MAP.loaded ? t('map.loaded',{n:fmtN(MAP.pts.length)}) : t('map.fail');
  requestDraw();
}
function resizeMap(){
  const r = $('#mapWrap').getBoundingClientRect();
  if (!r.width) return;
  const first = !MAP.w;
  MAP.dpr = Math.min(2, window.devicePixelRatio||1);
  const ow=MAP.w, oh=MAP.h;
  MAP.w = r.width; MAP.h = r.height;
  cv.width = Math.round(MAP.w*MAP.dpr); cv.height = Math.round(MAP.h*MAP.dpr);
  MAP.k0 = Math.min(MAP.w/345, MAP.h/135);
  const nr = Math.min(MAP.w, MAP.h-60)*0.42;
  MAP.R = MAP.R0 ? MAP.R*nr/MAP.R0 : nr; MAP.R0 = nr;
  if (first) fitMap(); else { MAP.cx += (MAP.w-ow)/2; MAP.cy += (MAP.h-oh)/2; }
  MAP.layer = null; requestDraw();
}
function fitMap(){
  const tall = MAP.w < MAP.h;
  MAP.k = MAP.k0*(tall?2.8:1); const lon = tall?28:12, lat = tall?36:12;
  MAP.cx = MAP.w/2 - lon*MAP.k; MAP.cy = MAP.h/2 + lat*MAP.k;
  MAP.R = MAP.R0; requestDraw();
}
const sx = lon => lon*MAP.k + MAP.cx;
const sy = lat => -lat*MAP.k + MAP.cy;
const gcx = () => MAP.w/2, gcy = () => MAP.h/2 + (MAP.w<760?40:30);
function zoomAt(x, y, f){
  if (MAP.globe) { MAP.R = Math.min(MAP.R0*14, Math.max(MAP.R0*0.7, MAP.R*f)); MAP.spin=false; requestDraw(); return; }
  const nk = Math.min(MAP.k0*400, Math.max(MAP.k0*0.8, MAP.k*f));
  const r = nk/MAP.k; MAP.cx = x-(x-MAP.cx)*r; MAP.cy = y-(y-MAP.cy)*r; MAP.k = nk; requestDraw();
}
function centerOn(lat, lon, zoom){
  if (MAP.globe) { MAP.target = {lat:Math.max(-70,Math.min(70,lat)), lon}; MAP.spin=false; if (zoom) MAP.R = Math.max(MAP.R, MAP.R0*Math.min(zoom,4)); requestDraw(); return; }
  if (zoom) MAP.k = Math.max(MAP.k, MAP.k0*zoom);
  MAP.cx = MAP.w/2 - lon*MAP.k; MAP.cy = MAP.h/2 + lat*MAP.k; requestDraw();
}
async function openMap(){
  MAP.active = true; MAP.force = true;
  $$('[data-act="map-mode"]').forEach(b=>b.classList.toggle('on', (b.dataset.m==='globe')===MAP.globe));
  requestAnimationFrame(()=>{ resizeMap(); requestDraw(); });
  await loadMapData();
  const st = LIB.get(S.cur);
  if (st && st.lat!=null) { if (MAP.globe) centerOn(st.lat, st.lon); else if (MAP.k<=MAP.k0*1.01) centerOn(st.lat, st.lon, 2.5); }
}
function setMapMode(globe){
  MAP.globe = globe; LS.set('globe', globe); MAP.layer=null;
  $$('[data-act="map-mode"]').forEach(b=>b.classList.toggle('on', (b.dataset.m==='globe')===globe));
  const st = LIB.get(S.cur);
  if (globe && st && st.lat!=null) { MAP.lat0 = Math.max(-70,Math.min(70,st.lat)); MAP.lon0 = st.lon; }
  showTip(null); requestDraw();
}
// çizim döngüsü: yalnızca animasyon gerekiyorsa sürer
function animating(){ return MAP.active && !document.hidden && (MAP.target || (MAP.globe && MAP.spin && !MAP.drag) || S.state==='playing' || S.state==='loading' || MAP.loading); }
function requestDraw(){ MAP.force = true; if (!MAP.raf && MAP.active && !document.hidden) MAP.raf = requestAnimationFrame(frame); }
function frame(ts){
  MAP.raf = 0;
  if (!MAP.active || document.hidden) return;
  const dt = Math.min(100, ts-(MAP.last||ts));
  if (MAP.force || ts-MAP.last >= 33) {
    MAP.last = ts; MAP.force = false;
    if (MAP.globe) {
      if (MAP.target) {
        let dl = ((MAP.target.lon-MAP.lon0+540)%360)-180, dp = MAP.target.lat-MAP.lat0;
        MAP.lon0 += dl*0.12; MAP.lat0 += dp*0.12;
        if (Math.abs(dl)<0.2 && Math.abs(dp)<0.2) MAP.target=null;
      } else if (MAP.spin && !MAP.drag) MAP.lon0 += dt*0.004;
      drawGlobeView(ts);
    } else drawFlat(ts);
  }
  if (animating() || MAP.force) MAP.raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', ()=>{ if (MAP.active && !document.hidden) requestDraw(); });

/* --- düz harita: statik katman (gece+nokta+iz) önbellekte, her karede yalnızca blit + dalga --- */
function nightPolyFlat(g, sp){
  const dec = Math.abs(sp.lat)<0.1 ? 0.1 : sp.lat;
  g.beginPath();
  for (let lon=-180; lon<=180; lon+=3){
    let lat = Math.atan(-Math.cos((lon-sp.lon)*D2R)/Math.tan(dec*D2R))/D2R;
    lat = Math.max(-85, Math.min(85, lat));
    lon===-180 ? g.moveTo(sx(lon),sy(lat)) : g.lineTo(sx(lon),sy(lat));
  }
  const pole = dec>0 ? -85 : 85;
  g.lineTo(sx(180),sy(pole)); g.lineTo(sx(-180),sy(pole)); g.closePath();
}
function dotR(){ return Math.max(1.1, Math.min(3.4, 1.15*Math.pow(MAP.k/MAP.k0, .35))); }
function buildFlatLayer(){
  const key = [MAP.w,MAP.h,MAP.k.toFixed(4),MAP.cx.toFixed(1),MAP.cy.toFixed(1),DATA_VER,Math.floor(Date.now()/60000),MAP.pts.length].join('|');
  if (MAP.layer && MAP.layerKey===key) return MAP.layer;
  const L = MAP.layer || document.createElement('canvas');
  if (L.width!==cv.width || L.height!==cv.height) { L.width=cv.width; L.height=cv.height; }
  const g = L.getContext('2d'), {w,h} = MAP;
  g.setTransform(MAP.dpr,0,0,MAP.dpr,0,0); g.clearRect(0,0,w,h);
  g.strokeStyle = PAL.line; g.lineWidth = 1; g.beginPath();
  for (let lon=-180; lon<=180; lon+=30){ const x=sx(lon); g.moveTo(x,sy(85)); g.lineTo(x,sy(-85)); }
  for (let lat=-60; lat<=80; lat+=20){ const y=sy(lat); g.moveTo(sx(-180),y); g.lineTo(sx(180),y); }
  g.stroke();
  const sp = sunPos();
  nightPolyFlat(g, sp); g.fillStyle = PAL.dark ? 'rgba(0,0,0,.38)' : 'rgba(40,40,70,.07)'; g.fill();
  g.fillStyle = PAL.acc; g.globalAlpha=.5; g.font='14px serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('☀', sx(sp.lon), sy(sp.lat)); g.globalAlpha=1;
  const r = dotR(), fs = favSet();
  g.fillStyle = PAL.acc; g.globalAlpha = .55; g.beginPath();
  for (const p of MAP.pts){ const x=sx(p.lon), y=sy(p.lat); if (x<-5||y<-5||x>w+5||y>h+5||fs.has(p.uuid)) continue; g.moveTo(x+r,y); g.arc(x,y,r,0,TAU); }
  g.fill(); g.globalAlpha = 1;
  g.fillStyle = PAL.sak; g.beginPath();
  for (const p of S.favs) if (p.lat!=null) { const x=sx(p.lon), y=sy(p.lat); g.moveTo(x+r+1,y); g.arc(x,y,r+1,0,TAU); }
  g.fill();
  drawTrail(g, p=>[sx(p.lon), sy(p.lat), true], r);
  MAP.layer = L; MAP.layerKey = key; return L;
}
function drawTrail(g, proj, r){
  const trail = S.recents.filter(x=>x.lat!=null).slice(0,20).reverse();
  if (trail.length>1){
    g.strokeStyle = PAL.sak; g.globalAlpha=.55; g.lineWidth=1; g.setLineDash([3,4]); g.beginPath();
    let pen=false;
    for (const x of trail){ const [a,b,vis]=proj(x); if (!vis){ pen=false; continue; } pen ? g.lineTo(a,b) : g.moveTo(a,b); pen=true; }
    g.stroke(); g.setLineDash([]); g.globalAlpha=1;
  }
  g.strokeStyle = PAL.sak; g.lineWidth=1.2;
  for (const e of Object.values(LOG.st)) { const x=e.d; if (!x||x.lat==null) continue; const [a,b,vis]=proj(x); if (!vis) continue; g.globalAlpha=Math.min(.9,.3+e.s/3600); g.beginPath(); g.arc(a,b,r+3,0,TAU); g.stroke(); }
  g.globalAlpha=1;
}
function drawRings(g, x, y, r, ts){
  g.fillStyle = PAL.acc; g.beginPath(); g.arc(x,y,r+2.5,0,TAU); g.fill();
  if (S.state==='playing' || S.state==='loading'){
    g.strokeStyle = PAL.acc; g.lineWidth=1.2;
    for (let i=0;i<3;i++){ const ph=((ts/1800)+i/3)%1; g.globalAlpha=(1-ph)*.7; g.beginPath(); g.arc(x,y,4+ph*34,0,TAU); g.stroke(); }
    g.globalAlpha = 1;
  }
}
function drawOverlay(g, proj, r, ts){
  if (MAP.hover){ const [x,y,v]=proj(MAP.hover); if (v){ g.strokeStyle=PAL.ink; g.lineWidth=1.2; g.beginPath(); g.arc(x,y,r+5,0,TAU); g.stroke(); } }
  if (MAP.me){ const [x,y,v]=proj(MAP.me); if (v){ g.fillStyle='#4a8fd0'; g.beginPath(); g.arc(x,y,4.5,0,TAU); g.fill(); g.strokeStyle='#4a8fd0'; g.globalAlpha=.35; g.beginPath(); g.arc(x,y,11,0,TAU); g.stroke(); g.globalAlpha=1; } }
  const st = LIB.get(S.cur);
  if (st && st.lat!=null){ const [x,y,v]=proj(st); if (v) drawRings(g,x,y,r,ts); }
  if (!MAP.loaded && MAP.loading){ g.fillStyle=PAL.ink3; g.font='11px "DM Mono", monospace'; g.textAlign='center'; g.fillText(t('map.loading'), MAP.w/2, MAP.h/2+ (MAP.globe?MAP.R+30:0)); }
}
function drawFlat(ts){
  const g = cv.getContext('2d');
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height);
  g.drawImage(buildFlatLayer(),0,0);
  g.setTransform(MAP.dpr,0,0,MAP.dpr,0,0);
  drawOverlay(g, p=>[sx(p.lon), sy(p.lat), true], dotR(), ts);
}

/* --- küre: ortografik izdüşüm, önceden hesaplanmış sin/cos ile ~6.000 nokta < 2 ms --- */
function globeProj(lat0, lon0, cx, cy, R){
  const sp0=Math.sin(lat0*D2R), cp0=Math.cos(lat0*D2R), sl0=Math.sin(lon0*D2R), cl0=Math.cos(lon0*D2R);
  const f = (sl,cl,sL,cL) => { const cd=cL*cl0+sL*sl0, sd=sL*cl0-cL*sl0; return [cx+R*cl*sd, cy-R*(cp0*sl-sp0*cl*cd), sp0*sl+cp0*cl*cd]; };
  f.ll = (lat,lon) => f(Math.sin(lat*D2R),Math.cos(lat*D2R),Math.sin(lon*D2R),Math.cos(lon*D2R));
  f.p = p => { const q = p.sl!==undefined ? f(p.sl,p.cl,p.sL,p.cL) : f.ll(p.lat,p.lon); return [q[0],q[1],q[2]>0,q[2]]; };
  return f;
}
// globeProj sabitlerini noktalar için de dışa aç
const _gp = globeProj;
function globeProjX(lat0,lon0,cx,cy,R){ const f=_gp(lat0,lon0,cx,cy,R); f.sp0=Math.sin(lat0*D2R); f.cp0=Math.cos(lat0*D2R); f.sl0=Math.sin(lon0*D2R); f.cl0=Math.cos(lon0*D2R); return f; }
function drawGlobeView(ts){
  const g = cv.getContext('2d');
  g.setTransform(MAP.dpr,0,0,MAP.dpr,0,0); g.clearRect(0,0,MAP.w,MAP.h);
  const cx=gcx(), cy=gcy(), R=MAP.R;
  const P = globeProjX(MAP.lat0, MAP.lon0, cx, cy, R);
  const fs = favSet();
  drawGlobeWith(g, P, {cx,cy,R,pal:PAL,pts:MAP.pts,favs:fs,ts});
  const r = Math.max(1, Math.min(3.2, R/170));
  g.fillStyle = PAL.sak; g.beginPath();
  for (const f of S.favs) if (f.lat!=null){ const [x,y,v]=P.p(f); if (v){ g.moveTo(x+r+1,y); g.arc(x,y,r+1,0,TAU); } }
  g.fill();
  drawTrail(g, P.p, r);
  drawOverlay(g, P.p, r, ts);
  MAP.P = P;
}
function drawGlobeWith(g, P, o){ // drawGlobe'un hızlı projeksiyonlu sürümü
  const {cx,cy,R,pal,pts,favs} = o;
  const grd = g.createRadialGradient(cx-R*.35,cy-R*.4,R*.05,cx,cy,R);
  grd.addColorStop(0, pal.dark ? '#26241f' : '#ffffff'); grd.addColorStop(1, pal.dark ? '#121110' : pal.bg2);
  g.fillStyle=grd; g.beginPath(); g.arc(cx,cy,R,0,TAU); g.fill();
  g.strokeStyle = pal.acc; g.globalAlpha=.22; g.lineWidth=1; g.beginPath(); g.arc(cx,cy,R+4,0,TAU); g.stroke(); g.globalAlpha=1;
  g.strokeStyle = pal.line; g.lineWidth=1; g.beginPath();
  for (let lon=-180; lon<180; lon+=30){ let pen=false; for (let lat=-80; lat<=80; lat+=5){ const q=P.ll(lat,lon); if (q[2]<=0){pen=false;continue;} pen?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); pen=true; } }
  for (let lat=-60; lat<=60; lat+=30){ let pen=false; for (let lon=-180; lon<=180; lon+=5){ const q=P.ll(lat,lon); if (q[2]<=0){pen=false;continue;} pen?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); pen=true; } }
  g.stroke();
  const sp = sunPos(), s = P.ll(sp.lat, sp.lon), sz = s[2];
  g.save(); g.translate(cx,cy); g.rotate(Math.atan2(s[1]-cy, s[0]-cx));
  g.beginPath(); g.arc(0,0,R,-Math.PI/2,Math.PI/2,true);
  const rx = Math.max(0.001, R*Math.abs(sz));
  if (sz>0) g.ellipse(0,0,rx,R,0,Math.PI/2,Math.PI*1.5,false); else g.ellipse(0,0,rx,R,0,Math.PI/2,-Math.PI/2,true);
  g.closePath(); g.fillStyle = pal.dark ? 'rgba(0,0,0,.45)' : 'rgba(40,40,70,.10)'; g.fill(); g.restore();
  if (sz>0){ g.fillStyle=pal.acc; g.globalAlpha=.55; g.font=`${Math.round(R/18)+8}px serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('☀', s[0], s[1]); g.globalAlpha=1; }
  const r = Math.max(1, Math.min(3.2, R/170));
  const {sp0,cp0,sl0,cl0} = P;
  g.fillStyle = pal.acc;
  for (const pass of [0,1]){
    g.globalAlpha = pass ? .72 : .26; g.beginPath();
    for (const p of pts){
      if (favs && favs.has(p.uuid)) continue;
      const cd=p.cL*cl0+p.sL*sl0, z=sp0*p.sl+cp0*p.cl*cd;
      if (z<=0 || (pass ? z<0.3 : z>=0.3)) continue;
      const x=cx+R*p.cl*(p.sL*cl0-p.cL*sl0), y=cy-R*(cp0*p.sl-sp0*p.cl*cd);
      g.moveTo(x+r,y); g.arc(x,y,r,0,TAU);
    }
    g.fill();
  }
  g.globalAlpha=1;
}
function nearestPx(x, y, max=16){
  let best=null, bd=max*max;
  if (MAP.globe) {
    const P = MAP.P || globeProjX(MAP.lat0,MAP.lon0,gcx(),gcy(),MAP.R);
    for (const p of MAP.pts){ const [a,b,v]=P.p(p); if (!v) continue; const dx=a-x, dy=b-y, d=dx*dx+dy*dy; if (d<bd){ bd=d; best=p; } }
    return best;
  }
  for (const p of MAP.pts){ const dx=sx(p.lon)-x, dy=sy(p.lat)-y, d=dx*dx+dy*dy; if (d<bd){ bd=d; best=p; } }
  return best;
}
const geoD = (a,b) => { const dl=(a.lon-b.lon)*Math.cos((a.lat+b.lat)/2*D2R); const dp=a.lat-b.lat; return dl*dl+dp*dp; };
function playNear(p, label){
  const near = MAP.pts.map(q=>[geoD(p,q),q]).sort((a,b)=>a[0]-b[0]).slice(0,40).map(x=>x[1]);
  if (p.uuid && !near.some(q=>q.uuid===p.uuid)) near.unshift(p);
  S.queue = near; S.queueCtx = 'map'; S.coll = null;
  play(near[0].uuid);
  toast(label || `${flag(near[0].cc)} ${near[0].name} — ${regionName(near[0].cc)}`);
}
function screenOf(p){ if (MAP.globe){ const P=MAP.P||globeProjX(MAP.lat0,MAP.lon0,gcx(),gcy(),MAP.R); const [x,y,v]=P.p(p); return v?[x,y]:null; } return [sx(p.lon), sy(p.lat)]; }
function showTip(p){
  const tip = $('#mapTip');
  const pos = p && screenOf(p);
  if (!pos){ tip.classList.remove('show'); return; }
  const dl = dayLabel(p);
  tip.innerHTML = `${flag(p.cc)} ${esc(p.name)}<small>${esc([p.state, regionName(p.cc)].filter(Boolean).join(', '))}${p.tags[0]?' · '+esc(p.tags[0]):''}${dl?' · '+esc(dl):''}</small>`;
  tip.style.left = pos[0]+'px'; tip.style.top = pos[1]+'px'; tip.classList.add('show');
}
(function mapInput(){
  const ptr = new Map(); let moved=0, pinchD=0;
  const pos = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,pos(e)); moved=0; MAP.drag=true; MAP.spin=false; MAP.target=null; cv.classList.add('grabbing');
    if (ptr.size===2){ const [a,b]=[...ptr.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y); } });
  cv.addEventListener('pointermove', e=>{
    const p = pos(e);
    if (!ptr.has(e.pointerId)){ if (e.pointerType==='mouse' && MAP.loaded){ const h=nearestPx(p.x,p.y,12); if (h!==MAP.hover){ MAP.hover=h; showTip(h); requestDraw(); } } return; }
    const prev = ptr.get(e.pointerId); ptr.set(e.pointerId,p);
    if (ptr.size===1){
      const dx=p.x-prev.x, dy=p.y-prev.y; moved += Math.abs(dx)+Math.abs(dy);
      if (MAP.globe){ MAP.lon0 -= dx/MAP.R/D2R; MAP.lat0 = Math.max(-80, Math.min(80, MAP.lat0 + dy/MAP.R/D2R)); }
      else { MAP.cx += dx; MAP.cy += dy; }
      if (MAP.hover){ MAP.hover=null; showTip(null); }
      requestDraw();
    } else if (ptr.size===2){ const [a,b]=[...ptr.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if (pinchD) zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinchD); pinchD=d; moved+=99; }
  });
  const up = e=>{
    if (!ptr.has(e.pointerId)) return;
    const p = ptr.get(e.pointerId); ptr.delete(e.pointerId); cv.classList.remove('grabbing');
    if (ptr.size<2) pinchD=0;
    if (!ptr.size) MAP.drag=false;
    if (e.type==='pointerup' && moved<6 && ptr.size===0 && MAP.loaded){
      const hit = nearestPx(p.x,p.y, e.pointerType==='mouse'?12:22);
      if (hit) { playNear(hit); if (MAP.globe) centerOn(hit.lat, hit.lon); }
      else zoomAt(p.x,p.y,1.6);
    }
    requestDraw();
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', ()=>{ if (MAP.hover){ MAP.hover=null; showTip(null); requestDraw(); } });
  cv.addEventListener('wheel', e=>{ e.preventDefault(); const p=pos(e); zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0016)); }, {passive:false});
  let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if (MAP.active) resizeMap(); }, 120); });
})();
function nearMe(){
  if (!navigator.geolocation){ toast(t('t.noGeo')); return; }
  toast(t('t.locating'));
  navigator.geolocation.getCurrentPosition(async pos=>{
    const me = {lat:pos.coords.latitude, lon:pos.coords.longitude};
    MAP.me = me;
    if (!$('#view-map').classList.contains('active')) switchView('map');
    await loadMapData();
    if (!MAP.pts.length){ toast(t('t.noMap')); return; }
    centerOn(me.lat, me.lon, MAP.globe?2.5:14);
    playNear(me, t('t.near'));
  }, ()=>toast(t('t.geoDenied')), {timeout:10000, maximumAge:600000});
}

/* ---------- dünya turu ---------- */
const TOUR = {on:false, iv:null, every:8};
function toggleTour(){
  TOUR.on = !TOUR.on;
  $$('.tour-btn').forEach(b=>b.classList.toggle('active', TOUR.on));
  clearInterval(TOUR.iv);
  if (TOUR.on){ toast(t('t.tourOn',{n:TOUR.every})); tourHop(); TOUR.iv = setInterval(()=>{ if (S.state==='playing') tourHop(); }, TOUR.every*60000); }
  else toast(t('t.tourOff'));
}
async function tourHop(){
  const curCC = LIB.get(S.cur)?.cc;
  let pool = MAP.loaded ? MAP.pts.filter(p=>p.cc && p.cc!==curCC && !S.bad.has(p.uuid)) : normList(await search('order=random', 60), S.bad).filter(p=>p.cc && p.cc!==curCC);
  if (!pool.length){ zap(); return; }
  const byCC = {}; for (const p of pool) (byCC[p.cc] ||= []).push(p);
  const cc = pick(Object.keys(byCC)); const st = pick(byCC[cc]);
  S.queue = [st, ...shuffle(byCC[cc].filter(x=>x.uuid!==st.uuid)).slice(0,10)]; S.queueCtx='tour'; S.coll=null;
  play(st.uuid);
  toast(`🌍 ${flag(st.cc)} ${regionName(st.cc)} — ${st.name}`);
  if (MAP.active && st.lat!=null) centerOn(st.lat, st.lon, 3);
}

/* ---------- çalar saat ---------- */
function openAlarm(){ const a = LS.get('alarm', null); if (a) { $('#alarmTime').value = a.time; $('#alarmSrc').value = a.src; } $('#alarmModal').classList.add('show'); }
function setAlarm(){
  const time = $('#alarmTime').value; if (!time) return;
  const cur = LIB.get(S.cur) || LS.get('last', null);
  LS.set('alarm', {time, src:$('#alarmSrc').value, st: cur ? slim(cur) : null, fired:''});
  $('#alarmModal').classList.remove('show'); updateAlarmBtn(); toast(t('t.alarmSet',{t:time}));
}
function updateAlarmBtn(){ const a = LS.get('alarm', null), b = $('#alarmBtn'); b.textContent = a ? '⏰ '+a.time : '⏰'; b.classList.toggle('active', !!a); }
async function fireAlarm(a){
  const target = LS.get('vol', 0.7);
  audio.volume = 0.02;
  if (a.src==='zap') await zap();
  else if (a.src==='kafe') await loadColl('mode','kafe');
  else {
    const st = a.src==='fav' && S.favs.length ? pick(S.favs) : (a.st || LS.get('last',null) || S.favs[0]);
    if (st) { LIB.set(st.uuid, st); S.queue=[st, ...S.favs.filter(f=>f.uuid!==st.uuid)]; S.queueCtx='alarm'; play(st.uuid); } else await zap();
  }
  let i=0; const ramp=setInterval(()=>{ i++; audio.volume=Math.min(target, 0.02+target*i/60); if (i>=60) clearInterval(ramp); }, 1000);
  toast(t('t.morning'));
}
setInterval(()=>{
  const a = LS.get('alarm', null); if (!a) return;
  const now = new Date(), hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if (hm===a.time && a.fired!==now.toDateString()){ a.fired=now.toDateString(); LS.set('alarm',a); fireAlarm(a); }
}, 10000);

/* =========================================================
   KARTPOSTAL — istasyonun yerel gün ışığına göre renklenir
   ========================================================= */
let pcBlob=null, pcName='';
function wrapLines(g, text, maxW, maxLines){
  const words = text.split(' '), lines=[]; let line='';
  for (const w of words){
    const test = line ? line+' '+w : w;
    if (g.measureText(test).width>maxW && line){ lines.push(line); line=w; if (lines.length===maxLines) break; }
    else line = test;
  }
  if (lines.length<maxLines && line) lines.push(line);
  if (lines.length===maxLines && words.join(' ')!==lines.join(' ')){ let l=lines[maxLines-1]; while (g.measureText(l+'…').width>maxW && l.length>1) l=l.slice(0,-1); lines[maxLines-1]=l.replace(/\s+$/,'')+'…'; }
  return lines;
}
async function makePostcard(){
  const st = LIB.get(S.cur); if (!st) { toast(t('t.playFirst')); return; }
  $('#pcBody').innerHTML = `<div class="pc-wait"><div class="spin"></div><div>${esc(t('pc.making'))}</div></div>`;
  $('#pcModal').classList.add('show');
  loadMapData().catch(()=>{});
  try { await Promise.race([Promise.all([document.fonts.load('300 72px "Noto Serif JP"'), document.fonts.load('400 26px "DM Mono"')]), new Promise(r=>setTimeout(r,1500))]); } catch(e){}
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const kind = dayKind(st) || 'day';
  const night = kind==='night';
  const pal = night
    ? {dark:true, bg:'#100f0e', bg2:'#1b1a17', ink:'#efebe2', ink2:'#9a958a', ink3:'#5d5a54', line:'#2c2a26', acc:'#c8a96e', sak:'#c47a8a'}
    : kind==='day'
    ? {dark:false, bg:'#f7f4ec', bg2:'#ebe6da', ink:'#1a1915', ink2:'#6b6860', ink3:'#aba89f', line:'#ddd8cc', acc:'#b8935a', sak:'#d998a8'}
    : {dark:false, bg:'#f6e9df', bg2:'#ecd6c8', ink:'#2a1d18', ink2:'#7a5f55', ink3:'#b39a8e', line:'#e3cbbd', acc:'#c07a4e', sak:'#d48a98'};
  g.fillStyle = pal.bg; g.fillRect(0,0,W,H);
  // ince çerçeve
  g.strokeStyle = pal.line; g.lineWidth = 2; g.strokeRect(36,36,W-72,H-72);
  // küre: istasyonun üzerinde
  const lat0 = st.lat!=null ? Math.max(-60,Math.min(60,st.lat)) : 25, lon0 = st.lon!=null ? st.lon : 20;
  const cx=W/2, cy=450, R=330;
  const P = globeProjX(lat0, lon0, cx, cy, R);
  drawGlobeWith(g, P, {cx,cy,R,pal,pts:MAP.pts,favs:null});
  if (st.lat!=null){
    const [x,y,v] = P.p(st);
    if (v){
      g.strokeStyle=pal.acc; g.lineWidth=2.5;
      for (let i=0;i<3;i++){ g.globalAlpha=.75-i*.22; g.beginPath(); g.arc(x,y,16+i*22,0,TAU); g.stroke(); }
      g.globalAlpha=1; g.fillStyle=pal.acc; g.beginPath(); g.arc(x,y,9,0,TAU); g.fill();
    }
  }
  // metin
  g.textAlign='left'; g.textBaseline='alphabetic';
  let y = 870;
  g.fillStyle = pal.acc; g.font = '400 24px "DM Mono", monospace';
  g.fillText(t('pc.now').split('').join(String.fromCharCode(8202)), 90, y);
  y += 78;
  g.fillStyle = pal.ink; g.font = '300 72px "Noto Serif JP", serif';
  const lines = wrapLines(g, st.name, W-180, 2);
  for (const l of lines){ g.fillText(l, 90, y); y += 84; }
  y += 6;
  g.font = '400 30px "DM Mono", monospace'; g.fillStyle = pal.ink2;
  const place = [st.state, regionName(st.cc)].filter(Boolean).join(', ');
  g.font = '34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const fl = flag(st.cc); let x0 = 90;
  if (fl){ g.fillText(fl, x0, y); x0 += 56; }
  g.font = '400 30px "DM Mono", monospace'; g.fillText(place || '—', x0, y);
  y += 50;
  const dl = dayLabel(st); const extra = [dl, st.tags.slice(0,2).join(' · ')].filter(Boolean).join('   ·   ');
  g.fillStyle = pal.ink3; g.font = '400 26px "DM Mono", monospace'; if (extra) g.fillText(extra, 90, y);
  // alt bilgi
  g.strokeStyle = pal.line; g.lineWidth=2; g.beginPath(); g.moveTo(90,1185); g.lineTo(W-90,1185); g.stroke();
  g.fillStyle = pal.ink; g.font = '300 46px "Noto Serif JP", serif'; g.fillText('rad', 90, 1262);
  let w1 = g.measureText('rad').width; g.fillStyle = pal.acc; g.fillText('—', 90+w1, 1262);
  let w2 = g.measureText('—').width; g.fillStyle = pal.ink; g.fillText('io', 90+w1+w2, 1262);
  g.textAlign='right'; g.fillStyle = pal.ink2; g.font = '400 24px "DM Mono", monospace';
  g.fillText(t('slogan'), W-90, 1236);
  g.fillStyle = pal.acc; g.fillText(((location.host||'hechecik.github.io') + (location.pathname||'/rad-io/')).replace(/index\.html$/,''), W-90, 1272);
  pcName = 'rad-io-' + (st.name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,40) || 'radio') + '.png';
  pcBlob = await new Promise(r=>c.toBlob(r,'image/png'));
  if (!pcBlob){ $('#pcModal').classList.remove('show'); return; }
  const url = URL.createObjectURL(pcBlob);
  $('#pcBody').innerHTML = `<img class="pc-img" src="${url}" alt="${esc(st.name)}">`;
}
function pcDownload(){ if (!pcBlob) return; const a=document.createElement('a'); a.href=URL.createObjectURL(pcBlob); a.download=pcName; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
async function pcShare(){
  if (!pcBlob) return;
  const st = LIB.get(S.cur), file = new File([pcBlob], pcName, {type:'image/png'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], text: st ? t('t.shareText',{name:st.name})+' '+stationUrl(st) : ''}); return; }
  } catch(e){ if (e.name==='AbortError') return; }
  pcDownload();
}

/* =========================================================
   ARAÇ MODU — büyük dokunmatik hedefler, ekran açık kalır,
   kaydırarak istasyon değiştir, tünelde otomatik yeniden bağlan
   ========================================================= */
let wakeLock=null;
async function wake(on){
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock=null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock=null; }
  } catch(e){}
}
function carOpen(){ return !$('#car').hidden; }
function openCar(){
  $('#car').hidden = false; document.body.style.overflow='hidden';
  wake(true); updateCar(); carClock();
  try { if (innerWidth<1000 && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{}); } catch(e){}
  if (!LS.get('carHint',false)) { toast(t('t.carHint')); LS.set('carHint',true); }
}
function closeCar(){ $('#car').hidden = true; wake(false); try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){} }
function carClock(){ const d=new Date(); $('#carClock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
setInterval(()=>{ if (carOpen()) carClock(); }, 10000);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && carOpen()) wake(true); });
function updateCar(){
  if (!carOpen()) return;
  const st = LIB.get(S.cur);
  $('#carFlag').textContent = st ? (flag(st.cc)||'📻') : '📻';
  $('#carName').textContent = st ? st.name : 'rad—io';
  $('#carSub').textContent = st ? [regionName(st.cc), st.tags[0], dayLabel(st)].filter(Boolean).join(' · ') : t('slogan');
  $('#carState').textContent = st ? kickerText() : '';
  const net = $('#carNet'); net.textContent = navigator.onLine ? '' : '● offline'; net.classList.toggle('off', !navigator.onLine);
  const tiles = [...S.favs, ...S.recents.filter(r=>!isFav(r.uuid))].slice(0,10);
  $('#carFavs').innerHTML = tiles.map(s=>`<button class="car-fav${s.uuid===S.cur?' on':''}" data-act="play-uid" data-ctx="${isFav(s.uuid)?'fav':'rec'}" data-uid="${esc(s.uuid)}"><span>${flag(s.cc)||'♪'}</span><span>${esc(s.name)}</span></button>`).join('');
}
(function carSwipe(){
  let x0=null, y0=0;
  const m = $('#carMain');
  m.addEventListener('pointerdown', e=>{ x0=e.clientX; y0=e.clientY; });
  m.addEventListener('pointerup', e=>{ if (x0==null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null; if (Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1); });
})();

/* ---------- cast / AirPlay ---------- */
(function cast(){
  const b = $('#castBtn');
  if (window.WebKitPlaybackTargetAvailabilityEvent) {
    audio.addEventListener('webkitplaybacktargetavailabilitychanged', e=>{ b.hidden = e.availability!=='available'; });
  } else if (audio.remote && audio.remote.watchAvailability) {
    audio.remote.watchAvailability(a=>{ b.hidden=!a; }).catch(()=>{ b.hidden=true; });
  }
})();
function doCast(){
  try {
    if (audio.webkitShowPlaybackTargetPicker) audio.webkitShowPlaybackTargetPicker();
    else if (audio.remote) { if (!audio.src) { toast(t('t.playFirst')); return; } audio.remote.prompt().catch(()=>{}); }
  } catch(e){}
}

/* ---------- install / sw ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; $('#installBtn').hidden=false; });
window.addEventListener('appinstalled', ()=>{ $('#installBtn').hidden=true; toast(t('t.installed')); });
async function installApp(){ if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; $('#installBtn').hidden=true; }
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if (a) {
    const d = a.dataset;
    switch(d.act){
      case 'view': switchView(d.v); return;
      case 'theme': toggleTheme(); return;
      case 'lang': toggleLang(); return;
      case 'home': switchView('stations'); return;
      case 'coll': loadColl(d.type, d.key); return;
      case 'refresh': refreshColl(); return;
      case 'play': playPause(); return;
      case 'next': step(1); return;
      case 'prev': step(-1); return;
      case 'zap': zap(); return;
      case 'fav': { const c=a.closest('[data-uid]'); if (c) toggleFav(c.dataset.uid); return; }
      case 'fav-cur': if (S.cur) toggleFav(S.cur); else toast(t('t.playFirst')); return;
      case 'play-uid': playFrom(d.ctx, d.uid); return;
      case 'share': share(); return;
      case 'sleep': cycleSleep(); return;
      case 'mute': toggleMute(); return;
      case 'static': S.staticFx=!S.staticFx; LS.set('static',S.staticFx); $('#staticBtn').classList.toggle('active',S.staticFx); toast(t(S.staticFx?'t.staticOn':'t.staticOff')); return;
      case 'help': $('#helpModal').classList.add('show'); return;
      case 'close-modal': if (e.target===a) a.classList.remove('show'); return;
      case 'disc': $$('.chip').forEach(c=>c.classList.toggle('active', c===a)); discover(d.q, d.l); return;
      case 'disc-more': discMore(); return;
      case 'export': exportFavs(); return;
      case 'import': $('#importIn').click(); return;
      case 'clear-recent': S.recents=[]; LS.set('recents',[]); DATA_VER++; renderSideLib(); renderLibrary(); return;
      case 'tour': toggleTour(); return;
      case 'near': nearMe(); return;
      case 'map-mode': setMapMode(d.m==='globe'); return;
      case 'map-center': { const st=LIB.get(S.cur); if (st && st.lat!=null) centerOn(st.lat,st.lon,MAP.globe?0:6); else toast(t('t.noPos')); return; }
      case 'map-reset': if (MAP.globe){ MAP.R=MAP.R0; MAP.lat0=25; requestDraw(); } else fitMap(); return;
      case 'zoom-in': zoomAt(MAP.globe?gcx():MAP.w/2, MAP.globe?gcy():MAP.h/2, 1.6); return;
      case 'zoom-out': zoomAt(MAP.globe?gcx():MAP.w/2, MAP.globe?gcy():MAP.h/2, 1/1.6); return;
      case 'alarm': openAlarm(); return;
      case 'alarm-set': setAlarm(); return;
      case 'alarm-off': LS.set('alarm',null); updateAlarmBtn(); $('#alarmModal').classList.remove('show'); toast(t('t.alarmOff')); return;
      case 'share-log': shareLog(); return;
      case 'similar': similar(); return;
      case 'install': installApp(); return;
      case 'postcard': makePostcard(); return;
      case 'pc-download': pcDownload(); return;
      case 'pc-share': pcShare(); return;
      case 'car': openCar(); return;
      case 'car-exit': closeCar(); return;
      case 'cast': doCast(); return;
      case 'play-log': { const en=LOG.st[d.uid]; if (en&&en.d){ S.queue=Object.values(LOG.st).filter(x=>x.d).sort((x,y)=>y.s-x.s).map(x=>{ if(!LIB.has(x.d.uuid)) LIB.set(x.d.uuid,x.d); return LIB.get(x.d.uuid); }); S.queueCtx='log'; play(en.d.uuid);} return; }
    }
  }
  const c = e.target.closest('.st-card');
  if (c) playFrom(c.dataset.ctx, c.dataset.uid);
});
document.addEventListener('keydown', e=>{
  if (e.target.closest('input,textarea,select')) { if (e.key==='Escape') e.target.blur(); return; }
  if (e.key==='Enter' && e.target.classList?.contains('st-card')) { e.target.click(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if (e.code==='Space'){ e.preventDefault(); playPause(); }
  else if (e.key==='ArrowRight') step(1);
  else if (e.key==='ArrowLeft') step(-1);
  else if (e.key==='ArrowUp'){ e.preventDefault(); setVol(audio.volume+.05); }
  else if (e.key==='ArrowDown'){ e.preventDefault(); setVol(audio.volume-.05); }
  else if (k==='r') zap();
  else if (k==='g') switchView('map');
  else if (k==='w') toggleTour();
  else if (k==='c') carOpen() ? closeCar() : openCar();
  else if (k==='p') makePostcard();
  else if (k==='f') { if (S.cur) toggleFav(S.cur); }
  else if (k==='m') toggleMute();
  else if (k==='t') toggleTheme();
  else if (k==='d') switchView('discover');
  else if (k==='l') switchView('library');
  else if (k==='q') switchView('queue');
  else if (e.key==='/') { e.preventDefault(); switchView('discover'); $('#searchIn').focus(); }
  else if (e.key==='?') $('#helpModal').classList.toggle('show');
  else if (e.key==='Escape') { $$('.modal').forEach(m=>m.classList.remove('show')); if (carOpen()) closeCar(); }
});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, ensureCtx, {once:true, passive:true}));
$('#volSlider').addEventListener('input', e=>setVol(parseFloat(e.target.value)));
$('#searchForm').addEventListener('submit', e=>{
  e.preventDefault(); const q=$('#searchIn').value.trim(); if (!q){ toast(t('t.searchEmpty')); return; }
  $$('.chip').forEach(c=>c.classList.remove('active'));
  $('#searchIn').blur();
  discover('__search:'+q, `“${q}”`);
});
$('#importIn').addEventListener('change', e=>{ const f=e.target.files[0]; if (f) importFavs(f); e.target.value=''; });
window.addEventListener('hashchange', ()=>{ const m=location.hash.match(/s=([\w-]+)/); if (m && m[1]!==S.cur) openShared(m[1]); });

/* ---------- start ---------- */
async function openShared(uuid){
  let st = LIB.get(uuid);
  if (!st) { const d = await api(`/json/stations/byuuid/${encodeURIComponent(uuid)}`); st = normList(d)[0]; }
  if (!st) { toast(t('t.shared404')); return false; }
  S.queue=[st]; S.queueCtx='shared';
  play(st.uuid); toast(`🔗 ${st.name}`);
  return true;
}
function timeMode(){
  const h = new Date().getHours();
  let set = TIME_MODES[TIME_MODES.length-1][1];
  for (const [start,m] of TIME_MODES) if (h>=start) set=m;
  if (h<5) set = TIME_MODES[TIME_MODES.length-1][1];
  return pick(set);
}
(async function init(){
  applyLang(); setVol(audio.volume); updateAlarmBtn();
  $('#staticBtn').classList.toggle('active', S.staticFx);
  loadStats();
  const m = location.hash.match(/s=([\w-]+)/);
  if (m && await openShared(m[1])) { loadColl('mode', timeMode(), {autoplay:false}); return; }
  await loadColl('mode', timeMode());
  const last = LS.get('last', null);
  if (last && last.uuid !== S.cur) { if (!LIB.has(last.uuid)) LIB.set(last.uuid, last); setTimeout(()=>toast(t('t.last',{name:last.name})), 3200); }
})();
</script>
